name: Deploy AWS
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}

jobs:
  deploy:
    if: ${{ vars.AWS_REGION != '' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: auth-service
            dockerfile: apps/auth-service/Dockerfile
          - name: crm-service
            dockerfile: apps/crm-service/Dockerfile
          - name: api-gateway
            dockerfile: apps/api-gateway/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/${{ matrix.service.name }}:${GITHUB_SHA}"
          BUILD_ARGS=()
          if [ "${{ matrix.service.name }}" = "web" ]; then
            BUILD_ARGS+=(--build-arg VITE_GRAPHQL_URL=/graphql)
          fi
          docker build "${BUILD_ARGS[@]}" -f "${{ matrix.service.dockerfile }}" -t "$IMAGE" .
          docker push "$IMAGE"
      - name: Register immutable task definition and deploy
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/${{ matrix.service.name }}:${GITHUB_SHA}"
          aws ecs describe-task-definition \
            --task-definition "${{ matrix.service.name }}" \
            --query taskDefinition > current-task-definition.json
          jq --arg IMAGE "$IMAGE" \
            '.containerDefinitions[0].image = $IMAGE
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            current-task-definition.json > next-task-definition.json
          TASK_DEFINITION_ARN="$(aws ecs register-task-definition \
            --cli-input-json file://next-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "${{ matrix.service.name }}" \
            --task-definition "$TASK_DEFINITION_ARN"
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "${{ matrix.service.name }}"
